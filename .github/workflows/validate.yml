name: Validate portfolio content
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: portfolio-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (immutable action, no persisted credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python runtime (immutable action)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validate approved source metadata
        run: python scripts/validate.py
      - name: Rebuild from curated source
        run: python scripts/build.py
      - name: Check links, anchors and verified domain
        run: python scripts/test_links.py
      - name: Security and privacy preflight
        run: python scripts/security_audit.py
      - name: Release integrity (source versus published files)
        run: python scripts/check_release.py
      - name: Security regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
