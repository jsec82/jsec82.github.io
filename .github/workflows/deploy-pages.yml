# This release process is effective ONLY after changing Settings > Pages >
# Build and deployment > Source to GitHub Actions. If the source remains the
# main branch, GitHub Pages publishes pushes regardless of this manual gate.
name: Publish approved portfolio to GitHub Pages
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: 'Paste the full reviewed 40-character SHA of main'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: portfolio-pages-release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require explicit approval for exact commit
        env:
          APPROVED_SHA: ${{ inputs.approved_commit }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          test "$APPROVED_SHA" = "$ACTUAL_SHA" || {
            echo 'The reviewed SHA does not match the commit selected for release.' >&2
            exit 1
          }
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python scripts/validate.py
      - run: python scripts/build.py
      - run: python scripts/test_links.py
      - run: python scripts/security_audit.py
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish only exact approved commit
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
