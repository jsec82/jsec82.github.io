name: Stage approved bilingual site (one-time)
on:
  push:
    branches:
      - feature/bilingual-dossiers-timeline-20261109
permissions:
  contents: write
jobs:
  build-reviewed-site:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout only reviewed feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify bundle and build audited pages
        run: python scripts/stage_bilingual_bundle.py
      - name: Publish source and generated files to feature branch only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Stage reviewed bilingual V3.1 with protected main rollback"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH" push origin HEAD:refs/heads/feature/bilingual-dossiers-timeline-20261109
